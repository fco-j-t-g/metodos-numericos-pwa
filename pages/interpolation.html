<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Raíces</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    
    <body>

        <header>
            <h1>Interpolación</h1>
            <h1><a href="../index.html">Regresar</a></h1>
        </header>
        <div class="container">

            <h2 class="page-title">
                Métodos de Interpolación
            </h2>

            <div class="form-group">
                <label>Método</label>
                <select id="methodSelect">
                    <option value="linear">Interpolación Lineal</option>
                    <option value="lagrange">Lagrange</option>
                </select>
            </div>

            <div class="form-group">
                <label>Valor de x a evaluar</label>
                <input id="targetXInput" placeholder="3">
            </div>

            <div class="form-group">
                <label>Tabla de puntos</label>
                <table id="pointsTable">
                    <thead>
                        <tr>
                            <th>x</th>
                            <th>y</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>


            <div style="display:flex; gap:10px; margin-top:15px;">
                <button id="addPointBtn">Agregar Punto</button>
                <button id="removePointBtn">Eliminar Punto</button>
            </div>

            <button id="calculateBtn" style="margin-top:15px;">Calcular</button>

            <div id="resultBox" class="result-box">Resultado</div>

            <table id="calculationTable" style="width:100%; margin-top:20px; border-collapse:collapse;"></table>

            <div class="result-box" style="margin-top:20px;">
                <h3>Datos e Interpolación</h3>
                <canvas id="interpolationChart"></canvas>
            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script type="module" src="../js/interpolation/interpolationPage.js"></script>
    </body>
</html>
